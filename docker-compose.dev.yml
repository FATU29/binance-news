version: "3.8"

# Development environment with hot reload
services:
  # Crawl Service with Air (hot reload)
  crawl-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crypto-crawl-dev
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SERVER_PORT=9000
      - ENVIRONMENT=development
      - READ_TIMEOUT=10
      - WRITE_TIMEOUT=10
      - CRAWLER_WORKERS=3
      - REQUEST_TIMEOUT=30
      - RATE_LIMIT_PER_MIN=60
      - AI_SERVICE_URL=http://localhost:8000
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=dev_password
      - DB_NAME=crypto_news_dev
    volumes:
      # Mount source code for hot reload
      - .:/app
      - go-cache:/go/pkg/mod
    networks:
      - crypto-dev-network
    depends_on:
      - postgres-dev
      - redis-dev

  # PostgreSQL for development
  postgres-dev:
    image: postgres:16-alpine
    container_name: crypto-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=crypto_news_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - crypto-dev-network

  # Redis for development
  redis-dev:
    image: redis:7-alpine
    container_name: crypto-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - crypto-dev-network

networks:
  crypto-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  go-cache:
